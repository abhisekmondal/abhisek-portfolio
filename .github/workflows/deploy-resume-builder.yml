name: Resume Builder CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "resume-builder" ]
    paths:
      - ".github/workflows/deploy-resume-builder.yml"
      - "Dockerfile"
      - "Dockerfile.api"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - "src/**"
      - "public/**"
      - "craco.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
  pull_request:
    branches: [ "resume-builder" ]
    paths:
      - ".github/workflows/deploy-resume-builder.yml"
      - "Dockerfile"
      - "Dockerfile.api"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - "src/**"
      - "public/**"
      - "craco.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"

concurrency:
  group: resume-builder-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_NAMESPACE: abhisek010
  FRONTEND_IMAGE: resume-builder-frontend
  API_IMAGE: resume-builder-api
  REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://resume-builder-api.greenbeach-62ce9dc0.centralindia.azurecontainerapps.io' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '4583ca9d-aca6-480e-b713-d4ef447c3157' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'KUBE' }}
  AZURE_CONTAINER_APP_ENV: ${{ vars.AZURE_CONTAINER_APP_ENV || 'resume-env' }}
  AZURE_FRONTEND_CONTAINER_APP: ${{ vars.AZURE_FRONTEND_CONTAINER_APP || 'resume-builder-frontend' }}
  AZURE_API_CONTAINER_APP: ${{ vars.AZURE_API_CONTAINER_APP || 'resume-builder-api' }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://builder.abhisek.tech' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run server tests
        run: npm run test:server

      - name: Build frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          build-args: |
            REACT_APP_API_URL=${{ env.REACT_APP_API_URL }}
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.DOCKER_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/${{ env.API_IMAGE }}:latest
            ${{ env.DOCKER_NAMESPACE }}/${{ env.API_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    env:
      FRONTEND_IMAGE_REF: docker.io/abhisek010/resume-builder-frontend:latest
      API_IMAGE_REF: docker.io/abhisek010/resume-builder-api:latest

    steps:
      - name: Validate deployment variables
        run: |
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID repository variable is required."; exit 1; }
          test -n "$AZURE_RESOURCE_GROUP" || { echo "AZURE_RESOURCE_GROUP repository variable is required."; exit 1; }
          test -n "$AZURE_CONTAINER_APP_ENV" || { echo "AZURE_CONTAINER_APP_ENV repository variable is required."; exit 1; }
          test -n "$AZURE_FRONTEND_CONTAINER_APP" || { echo "AZURE_FRONTEND_CONTAINER_APP repository variable is required."; exit 1; }
          test -n "$AZURE_API_CONTAINER_APP" || { echo "AZURE_API_CONTAINER_APP repository variable is required."; exit 1; }

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select Azure subscription
        run: az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Prepare Azure Container Apps CLI
        run: az extension add --name containerapp --upgrade

      - name: Configure container registry access
        run: |
          az containerapp registry set \
            --name "$AZURE_API_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server docker.io \
            --username "${{ secrets.DOCKER_USERNAME }}" \
            --password "${{ secrets.DOCKER_PASSWORD }}"
          az containerapp registry set \
            --name "$AZURE_FRONTEND_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server docker.io \
            --username "${{ secrets.DOCKER_USERNAME }}" \
            --password "${{ secrets.DOCKER_PASSWORD }}"

      - name: Configure API secrets
        run: |
          az containerapp secret set \
            --name "$AZURE_API_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets \
              database-url="${{ secrets.DATABASE_URL }}" \
              jwt-secret="${{ secrets.JWT_SECRET }}" \
              smtp-user="${{ secrets.SMTP_USER }}" \
              smtp-pass="${{ secrets.SMTP_PASS }}"

      - name: Deploy API container app
        run: |
          az containerapp update \
            --name "$AZURE_API_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$API_IMAGE_REF" \
            --set-env-vars \
              NODE_ENV=production \
              DEPLOYMENT_SHA=${{ github.sha }} \
              API_PORT=4000 \
              CORS_ORIGIN="$FRONTEND_URL" \
              APP_URL="$FRONTEND_URL" \
              TRUST_PROXY=true \
              JSON_LIMIT=512kb \
              RATE_LIMIT_MAX=300 \
              IMPORT_FILE_LIMIT_BYTES=6291456 \
              PASSWORD_RESET_TOKEN_MINUTES=30 \
              PASSWORD_RESET_EXPOSE_TOKEN=false \
              PGSSLMODE=require \
              MAIL_FROM="${{ vars.MAIL_FROM || 'Resume Builder <no-reply@abhisek.tech>' }}" \
              SMTP_HOST="${{ vars.SMTP_HOST || 'smtp-relay.brevo.com' }}" \
              SMTP_PORT="${{ vars.SMTP_PORT || '587' }}" \
              SMTP_SECURE="${{ vars.SMTP_SECURE || 'false' }}" \
              DATABASE_URL=secretref:database-url \
              JWT_SECRET=secretref:jwt-secret \
              SMTP_USER=secretref:smtp-user \
              SMTP_PASS=secretref:smtp-pass

      - name: Deploy frontend container app
        run: |
          az containerapp update \
            --name "$AZURE_FRONTEND_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$FRONTEND_IMAGE_REF" \
            --set-env-vars \
              DEPLOYMENT_SHA=${{ github.sha }}

      - name: Show deployed revisions
        run: |
          az containerapp revision list \
            --name "$AZURE_API_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].{app:name,active:properties.active,created:properties.createdTime}" \
            --output table
          az containerapp revision list \
            --name "$AZURE_FRONTEND_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].{app:name,active:properties.active,created:properties.createdTime}" \
            --output table
